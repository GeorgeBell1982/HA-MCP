name: Home Assistant Engineering MCP
version: "0.3.0"
slug: home_assistant_engineering_mcp
description: Paired diagnostics, dashboards and third-party setup with human approval
url: https://github.com/GeorgeBell1982/HA-MCP
arch:
  - aarch64
startup: application
boot: auto
init: false
homeassistant_api: true
hassio_api: true
hassio_role: manager
ingress: true
ingress_port: 8099
panel_icon: mdi:tools
ports:
  8443/tcp: null
ports_description:
  8443/tcp: TLS-only Streamable HTTP MCP (enable and bind explicitly)
map:
  - type: homeassistant_config
    read_only: false
options:
  enable_http: false
  enable_phase2: true
  enable_mcp_writes: false
  enable_mcp_setup: false
  setup_frontend_url: ""
  bind: "0.0.0.0"
  allowed_host: "192.168.50.160:8443"
  max_clients: 16
  max_sessions_per_client: 2
schema:
  enable_http: bool
  enable_phase2: bool
  enable_mcp_writes: bool
  enable_mcp_setup: bool
  setup_frontend_url: str
  bind: str
  allowed_host: str
  max_clients: int(1,64)
  max_sessions_per_client: int(1,8)
